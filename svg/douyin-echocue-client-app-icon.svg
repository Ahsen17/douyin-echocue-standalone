<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Douyin EchoCue client app icon</title>
  <desc id="desc">A live interaction cue rendered as a warm notification dot and three echo waves.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="54" x2="442" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202733"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="accent" x1="174" y1="182" x2="310" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8669"/>
      <stop offset="1" stop-color="#FA4F5E"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#000000" flood-opacity=".25"/>
