  <rect x="36" y="36" width="440" height="440" rx="120" fill="url(#background)"/>
  <path d="M272 145c59 0 107 48 107 107s-48 107-107 107" fill="none" stroke="#F8F5EE" stroke-linecap="round" stroke-width="28" opacity=".3"/>
  <path d="M272 183c38 0 69 31 69 69s-31 69-69 69" fill="none" stroke="#F8F5EE" stroke-linecap="round" stroke-width="28" opacity=".66"/>
  <path d="M272 221c17 0 31 14 31 31s-14 31-31 31" fill="none" stroke="#F8F5EE" stroke-linecap="round" stroke-width="28"/>
  <circle cx="188" cy="252" r="47" fill="url(#accent)" filter="url(#shadow)"/>
</svg>
