# Windows x64 standalone packaging. One-click NSIS install to the per-user
# directory (no admin, no path selection); user data lives separately under
# %LOCALAPPDATA%\Echocue (see RUNBOOK §2.3) and is never written into the
# install dir. Sidecars/migration/icon are bundled as extraResources and
# resolved at runtime via src/main/util/resource-path.ts — the repo-relative
# `to` paths below are what that helper re-derives inside process.resourcesPath.
appId: com.echocue.desktop
productName: Echocue
asar: true

directories:
  output: release
  buildResources: build

# Vite bundles everything except node builtins, electron, jieba-wasm,
# @qdrant/js-client-rest and ws (vite.config.main.ts). electron-builder also
# packs all other production node_modules automatically, so these globs just pin
# the must-ship externalized runtime modules; `files` keeps Linux sidecars,
# docs and sources out of the installer.
files:
  - dist/**
  - node_modules/jieba-wasm/**
  - node_modules/@qdrant/**
  - node_modules/undici/**
  - node_modules/ws/**

# jieba-wasm instantiates its .wasm from disk; unpack it so the real file path
# is available outside app.asar.
asarUnpack:
  - node_modules/jieba-wasm/**

extraResources:
  - from: assets/qdrant_windows.exe
    to: assets/qdrant_windows.exe
  - from: assets/douyinLive_windows.exe
    to: assets/douyinLive_windows.exe
  - from: resources/qdrant-config.yaml
    to: resources/qdrant-config.yaml
  - from: docs/06-data-interface/migrations/001_initial_schema.sql
    to: docs/06-data-interface/migrations/001_initial_schema.sql
  - from: docs/06-data-interface/migrations/002_queue_timeout_reason.sql
    to: docs/06-data-interface/migrations/002_queue_timeout_reason.sql
  - from: build/icon.png
    to: build/icon.png
  - from: build/tray.png
    to: build/tray.png

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # One-click per-user install (reverted from assisted: the assisted page flow
  # introduced by oneClick:false crashed the installer with 0xC0000005 on the
  # Windows runner, independent of the custom NSIS code — see PR #67 history).
  # Data-save location still works via build/installer.nsh writing the boot
  # pointer + in-app migration; install-dir selection at install time is dropped.
  oneClick: true
  perMachine: false
  allowElevation: false
  # Uninstall data cleanup is handled by the customUnInstall macro in
  # build/installer.nsh (WP-6), so this stays false to avoid unconditional
  # appdata removal.
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  # Deterministic install E2E: silent install must not auto-launch the app
  # (would hold %LOCALAPPDATA%\Echocue open during Clear-DataRoot).
  runAfterFinish: false
