name: Package on Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# M7-08 / T-PKG-001 / A-09: build the real NSIS installer on a Windows runner,
# then install / upgrade / exit / uninstall it and assert no sidecar residue.
# M7-09: generate the release manifest (SHA-256, versions, license, SBOM).
jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app bundles
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: License check + SBOM
        run: npm run compliance

      - name: Generate icons from SVGs
        run: npm run icons

      - name: Build Windows installer
        run: npm run package:win

      - name: Verify install / upgrade / exit / no-residue / clean-data uninstall
        env:
          # WP-6: exercise the optional user-data-cleanup uninstall branch.
          ECHOCUE_VERIFY_CLEAN_DATA: '1'
        run: npm run package:verify

      - name: Run T-PKG-001 Windows install E2E
        env:
          ECHOCUE_PKG_DIR: ${{ github.workspace }}\release
        run: npx vitest run tests/e2e/T-PKG-001-windows-install.test.ts

      - name: Generate release manifest
        run: npm run release:manifest

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echocue-release-${{ github.sha }}
          path: |
            release/
            dist/compliance/
