name: Release Windows

# Tag-triggered release per .claude/rules/release.md (§3): a `v*` tag push builds
# the NSIS installer on a Windows runner, re-verifies it end-to-end, then
# publishes a DRAFT GitHub Release for the tag (maintainer reviews → publish).
# Source archives (zip/tar.gz) are auto-generated by GitHub for the tagged commit.
# This workflow is the ONLY publishing path; package-windows.yml keeps --publish
# never so CI never creates a Release without an explicit tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app bundles
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: License check + SBOM
        run: npm run compliance

      - name: Generate icons from SVGs
        run: npm run icons

      - name: Build Windows installer
        run: npm run package:win

      - name: Verify install / upgrade / exit / no-residue
        run: npm run package:verify

      - name: Run T-PKG-001 Windows install E2E
        env:
          ECHOCUE_PKG_DIR: ${{ github.workspace }}\release
        run: npx vitest run tests/e2e/T-PKG-001-windows-install.test.ts

      - name: Generate release manifest
        run: npm run release:manifest

      - name: Publish draft release to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INSTALLER=$(ls release/Echocue*.exe)
          gh release create "$GITHUB_REF_NAME" \
            "$INSTALLER" \
            "release/manifest.json" \
            "release/hashes.json" \
            "dist/compliance/licenses.json" \
            "dist/compliance/sbom.cdx.json" \
            --target "$GITHUB_SHA" \
            --draft \
            --generate-notes
